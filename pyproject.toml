[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propagandafilter"
description = "Propaganda-Filter: findet Werbung in Ton (zwei Fassungen vergleichen, Signaturen sammeln) für eigene Apps"
requires-python = ">=3.12"
dynamic = ["version"]  # aus version.json, der einzigen Quelle
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "numpy>=2.0",
  "tomli-w>=1.0",
  "appkern @ git+https://github.com/HalloWelt42/appkern",
]

[project.optional-dependencies]
entwicklung = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.dynamic]
version = {attr = "propagandafilter.fassung.NUMMER"}

[tool.setuptools.packages.find]
include = ["propagandafilter*"]
